<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>it works!</title>
    <style type="text/css" media="screen">
      * { margin: 0; padding: 0; }
      body {
        padding: 3px;
        background: #E4F2E1;
        font-family: Ubuntu, Verdana, sans-serif;
        font-size: 11pt;
        text-align: center;
      }
      .main_page {
        width: 800px;
        margin: 0 auto 3px;
        border: 2px solid #24382C;
        background: #FFFEFB;
      }
      .page_header {
        padding: 10px 12px;
        background: #F4FBF2;
        font-size: 180%;
        font-weight: bold;
      }
      .content_section { margin: 3px; text-align: left; }
      .content_section_text { padding: 4px 8px; }
      .content_section_text p { margin-bottom: 6px; }
      table.defaults { width: 100%; border-collapse: collapse; margin: 8px 0; }
      table.defaults th, table.defaults td {
        padding: 3px 8px;
        text-align: left;
      }
      table.defaults th { background: #E4F2E1; }
      table.defaults td {
        border-bottom: 1px dotted #24382C;
        font-family: monospace;
      }
      table.defaults td.name { font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="main_page">
      <div class="page_header">tiny Default Page</div>
      <div class="content_section">
        <div class="content_section_text">
          <p>
            this is the default page for the tiny webserver.
          </p>
          <p>
            if you can read this, the binary is serving files.
            this is <tt>index.html</tt>, supplemented by <tt>defaults.tiny</tt>
            defaults come from <tt>src/config.h</tt>, they are compiled and listed here via make.
          </p>
        </div>

        <div class="content_section_text">
          <p id="defaults-note">
            Waiting on <tt>defaults.tiny</tt>.
          </p>
          <table class="defaults">
            <thead>
              <tr><th>constant</th><th>compiled value</th></tr>
            </thead>
            <tbody id="defaults-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script type="text/javascript">
      (function () {
        var rows = document.getElementById("defaults-rows");
        var note = document.getElementById("defaults-note");
        function say(msg) {
          if (!note) return;
          while (note.firstChild) note.removeChild(note.firstChild);
          note.appendChild(document.createTextNode(msg));
        }
        fetch("defaults.tiny").then(function (res) {
          if (!res.ok) throw new Error("missing");
          return res.text();
        }).then(function (text) {
          var lines = text.split("\n");
          var n = 0;
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var tab = line.indexOf("\t");
            if (tab < 1) continue;
            var tr = document.createElement("tr");
            var name = document.createElement("td");
            var value = document.createElement("td");
            name.className = "name";
            value.className = "value";
            name.appendChild(document.createTextNode(line.slice(0, tab)));
            value.appendChild(document.createTextNode(line.slice(tab + 1)));
            tr.appendChild(name);
            tr.appendChild(value);
            rows.appendChild(tr);
            n++;
          }
          if (!n) throw new Error("empty");
          if (note) note.style.display = "none";
        }).catch(function () {
          say("no 'defaults.tiny' present, run 'make' to compile and generate one");
        });
      })();
    </script>
  </body>
</html>
